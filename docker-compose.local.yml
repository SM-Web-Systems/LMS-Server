services:
  app:
    build: .
    container_name: lms-server
    env_file: .env
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lms-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST_PATH:-../LMS-Frontend/dist}:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
