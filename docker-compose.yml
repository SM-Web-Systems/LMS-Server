services:
  app:
    build: .
    container_name: lms-server
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lms-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - LMS_DOMAIN=${LMS_DOMAIN:-lms.smwebsystems.com}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${FRONTEND_DIST_PATH:-../LMS-Frontend/dist}:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: lms-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ${FRONTEND_DIST_PATH:-../LMS-Frontend/dist}:/usr/share/nginx/html
    depends_on:
      - nginx

volumes:
  certbot-etc:
  certbot-var:
